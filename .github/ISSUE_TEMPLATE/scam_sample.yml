name: Scam sample
description: Share a scam message, link or QR code to improve detection.
title: "sample: "
labels: ["scam-sample", "detection"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you submit:** remove or mask all personal data: your number, name, account details, OTPs.
        Mask phone numbers like `98XXXXXX21` and UPI IDs like `xy***@examplebank`.
        Defang links so they are not clickable (`hxxps://example[.]com`).
  - type: dropdown
    id: type
    attributes:
      label: Sample type
      options:
        - Text message (SMS / WhatsApp / Telegram)
        - Link / URL
        - QR code
        - Email
        - Other
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Scam category (best guess)
      options:
        - KYC / account blocking
        - Fake job / task scam
        - Lottery / prize
        - Delivery / courier
        - UPI "receive money" / collect request
        - Electricity / utility disconnection
        - Investment / crypto
        - Impersonation (police, bank, family)
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [English, Hindi, Kannada, Mixed, Other]
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample (masked)
      description: Paste the message text or defanged link, or attach the QR image.
      render: text
    validations:
      required: true
  - type: input
    id: channel
    attributes:
      label: Where did you receive it?
      placeholder: e.g. SMS, WhatsApp, Telegram group
  - type: input
    id: verdict
    attributes:
      label: What did Satark say (if you checked it)?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed or masked all personal data in this sample.
          required: true
        - label: I agree this sample may be added to the public evaluation dataset.
          required: true
