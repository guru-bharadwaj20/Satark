name: build

on:
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to rebuild (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  services:
    name: changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          INPUT_SERVICES: ${{ inputs.services }}
        run: |
          # Only services whose folder changed are rebuilt. A change to this
          # workflow, or a manual run without input, rebuilds everything.
          all=$(find apps -mindepth 2 -maxdepth 2 -name Dockerfile 2>/dev/null \
            | xargs -r -n1 dirname | xargs -r -n1 basename | sort)
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -n "$INPUT_SERVICES" ]; then
              sel=$(echo "$INPUT_SERVICES" | tr ',' '\n' | sed 's/ //g' | grep -Fx -f <(echo "$all") || true)
            else
              sel=$all
            fi
          elif [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ] \
               || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            sel=$all
          else
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            if echo "$changed" | grep -qx '.github/workflows/build.yml'; then
              sel=$all
            else
              sel=$(echo "$changed" | awk -F/ '$1=="apps"{print $2}' | sort -u | grep -Fx -f <(echo "$all") || true)
            fi
          fi
          svcs=$(printf '%s\n' $sel | sed '/^$/d' | jq -R . | jq -cs .)
          echo "services=${svcs:-[]}" >> "$GITHUB_OUTPUT"
          echo "Services to build: ${svcs:-[]}" | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    name: ${{ matrix.service }}
    needs: services
    if: needs.services.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.services) }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.licenses=MIT
      # Build once for the runner's architecture and scan it before anything
      # is pushed, so a CRITICAL finding blocks the release.
      - name: build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          load: true
          tags: scan/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy SARIF report (all severities)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "0"
      - name: upload SARIF
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: build multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Syft SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: scan/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          artifact-name: sbom-${{ matrix.service }}.spdx.json
      - uses: sigstore/cosign-installer@v3
        if: env.PUSH == 'true'
      - name: cosign keyless sign and attest SBOM
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          # Keyless: the signing certificate is issued by Fulcio for this
          # workflow's GitHub OIDC identity and logged in Rekor.
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson \
            --predicate "sbom-${{ matrix.service }}.spdx.json" "$IMAGE"
      - name: how to verify
        if: env.PUSH == 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### ${{ matrix.service }}
          \`\`\`
          cosign verify ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${{ steps.build.outputs.digest }} \\
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/.github/workflows/build.yml@refs/heads/main$' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF

  bump-dev:
    name: bump image tags in gitops/envs/dev
    needs: [services, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.services.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-dev-bump
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: install yq
        run: |
          sudo curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: update tags
        env:
          SERVICES: ${{ needs.services.outputs.services }}
        run: |
          tag="${GITHUB_SHA::7}"
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            f="gitops/envs/dev/apps/$svc/values.yaml"
            [ -f "$f" ] || { echo "skip $svc: no $f"; continue; }
            TAG="$tag" yq -i '.image.tag = strenv(TAG)' "$f"
            echo "$svc -> $tag"
          done
      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/envs/dev
          if git diff --cached --quiet; then echo "nothing to bump"; exit 0; fi
          git commit -m "chore(gitops): bump dev images to ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
