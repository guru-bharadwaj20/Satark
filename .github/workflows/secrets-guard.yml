name: secrets-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-plain-secrets:
    name: no plain Kubernetes Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-plain-secrets.sh
