name: go

on:
  pull_request:
    paths:
      - "apps/**/*.go"
      - "apps/**/go.mod"
      - "apps/**/go.sum"
      - "tools/**"
      - "**/.golangci.yml"
      - ".github/workflows/go.yml"
  push:
    branches: [main]
    paths:
      - "apps/**/*.go"
      - "apps/**/go.mod"
      - "apps/**/go.sum"
      - "tools/**"
      - "**/.golangci.yml"
      - ".github/workflows/go.yml"

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    name: discover Go modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          mods=$(find apps tools -name go.mod -not -path '*/vendor/*' 2>/dev/null \
            | xargs -r -n1 dirname | sort | jq -R . | jq -cs .)
          echo "modules=${mods:-[]}" >> "$GITHUB_OUTPUT"
          echo "Go modules: ${mods:-[]}"

  lint-test:
    name: ${{ matrix.module }}
    needs: modules
    if: needs.modules.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: ${{ matrix.module }}
          args: --timeout=5m
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
