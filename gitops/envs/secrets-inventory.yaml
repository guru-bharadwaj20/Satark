# Inventory of every Secret Satark needs. Values are never stored
# here: each entry is sealed with scripts/seal-all-secrets.sh into
# gitops/envs/<env>/secrets/<name>.sealed.yaml and only that file is committed.
# Plain `kind: Secret` manifests are rejected in CI by
# scripts/check-no-plain-secrets.sh.
secrets:
  - name: telegram-bot-token
    namespace: satark
    keys: [TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET]
    consumers: [telegram-bot]
    rotation: 90d
  - name: gateway-api-keys
    namespace: satark
    keys: [API_KEY_HMAC_SECRET]
    consumers: [gateway-api]
    rotation: 90d
  - name: url-intel-feeds
    namespace: satark
    keys: [GOOGLE_SAFE_BROWSING_API_KEY, PHISHTANK_API_KEY]
    consumers: [url-intel, feed-sync]
    rotation: 180d
  - name: llm-provider
    namespace: satark
    keys: [LLM_API_KEY]
    consumers: [text-analyzer, opsbot]
    rotation: 90d
  - name: opsbot-telegram
    namespace: satark
    keys: [OPSBOT_TELEGRAM_TOKEN, OPSBOT_CHAT_ID]
    consumers: [opsbot]
    rotation: 90d
  - name: satark-pg-app
    namespace: satark-data
    type: kubernetes.io/basic-auth
    keys: [username, password]
    consumers: [satark-pg, gateway-api, reputation]
    rotation: 90d
  - name: satark-pg-backup-s3
    namespace: satark-data
    keys: [ACCESS_KEY_ID, ACCESS_SECRET_KEY]
    consumers: [satark-pg (CNPG barman)]
    rotation: 90d
  - name: valkey-auth
    namespace: satark-data
    keys: [VALKEY_PASSWORD]
    consumers: [valkey, gateway-api, url-intel, reputation]
    rotation: 90d
  - name: nats-auth
    namespace: satark-data
    keys: [NATS_USER, NATS_PASSWORD]
    consumers: [nats, gateway-api, url-intel, sandbox-browser]
    rotation: 90d
  - name: velero-s3
    namespace: velero
    keys: [cloud]
    consumers: [velero]
    rotation: 90d
  - name: alertmanager-receivers
    namespace: monitoring
    keys: [TELEGRAM_BOT_TOKEN, OPSBOT_WEBHOOK_TOKEN]
    consumers: [alertmanager]
    rotation: 90d
  - name: grafana-admin
    namespace: monitoring
    keys: [admin-user, admin-password]
    consumers: [grafana]
    rotation: 90d
