# text-analyzer values for dev. Overrides charts/text-analyzer/values.yaml.
image:
  repository: ghcr.io/guru-bharadwaj20/satark/text-analyzer
  # Updated automatically by CI (dev) or by a promotion PR (prod).
  tag: "0.1.0"
replicaCount: 1
service:
  port: 8000
resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi
env:
  SATARK_ENV: dev
  LOG_LEVEL: debug
