apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: satark-data
resources:
  - scheduled-backup.yaml
# The satark-pg Cluster itself is owned by the data layer. This patch adds
# continuous WAL archiving and base-backup storage to it.
patches:
  - path: cluster-backup-patch.yaml
    target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: satark-pg
