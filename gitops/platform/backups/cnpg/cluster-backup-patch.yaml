# Strategic-merge patch for the satark-pg CNPG Cluster.
# Credentials come from IRSA-style static keys stored in the `satark-pg-s3`
# Secret (synced by External Secrets from AWS Secrets Manager).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: satark-pg
spec:
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://satark-backups-prod/cnpg/satark-pg
      s3Credentials:
        accessKeyId:
          name: satark-pg-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: satark-pg-s3
          key: ACCESS_SECRET_KEY
        region:
          name: satark-pg-s3
          key: REGION
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
        jobs: 2
  # Force a WAL segment switch at least every 5 minutes so the worst-case RPO
  # on a quiet database stays bounded.
  postgresql:
    parameters:
      archive_timeout: "5min"
