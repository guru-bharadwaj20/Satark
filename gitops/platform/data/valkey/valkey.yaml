# Single-instance Valkey used as a cache and rate-limit store. Data loss on
# restart is acceptable (verdicts are recomputed, buckets refill), so
# persistence is append-only with everysec fsync on a small volume only to
# survive routine restarts. Auth: Secret valkey-auth (key: password),
# created by scripts/platform/install-valkey.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-config
  namespace: satark-data
data:
  valkey.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode yes
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfsync everysec
    save ""
    dir /data
    rename-command FLUSHALL ""
    rename-command FLUSHDB ""
    rename-command DEBUG ""
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: satark-data
  labels:
    app.kubernetes.io/name: valkey
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: satark-data
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: satark
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: satark
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8.0.1-alpine
          command: ["sh", "-c"]
          args:
            - exec valkey-server /etc/valkey/valkey.conf --requirepass "$VALKEY_PASSWORD"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-auth
                  key: password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: valkey-auth
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/valkey
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: valkey-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
---
# Only Satark application pods (satark, satark-dev) may reach Valkey.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-allow-satark
  namespace: satark-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: ["satark", "satark-dev"]
      ports:
        - port: 6379
          protocol: TCP
