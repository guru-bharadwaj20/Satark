# Argo CD Application: Grafana Alloy DaemonSet shipping pod logs to Loki (task 6.2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 0.9.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/gitops/platform/alloy/values.yaml
    - repoURL: https://github.com/guru-bharadwaj20/satark.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
