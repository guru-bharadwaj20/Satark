# Helm values for Envoy Gateway (oci://docker.io/envoyproxy/gateway-helm).
deployment:
  replicas: 2
  envoyGateway:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  pod:
    # One controller per node. A soft anti-affinity let a rollout put both on
    # one worker; when that node locked up, the proxies kept serving stale
    # endpoints until the controller was restarted (task 11.17).
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            control-plane: envoy-gateway

config:
  envoyGateway:
    logging:
      level:
        default: info
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller

podDisruptionBudget:
  minAvailable: 1
