# Public Gateway for Satark. Traffic reaches it from the AWS edge proxy over
# WireGuard (Phase 5). TLS is terminated here with a certificate issued by
# cert-manager into Secret satark-public-tls; plain HTTP only redirects.
# Routes are attached by the service charts (HTTPRoute in satark / satark-dev).
# Replace the example hostnames with the real domain in gitops/envs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: satark-public
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: satark
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.satark.example"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: satark-public-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: ["satark", "satark-dev"]
---
# Redirect every plain-HTTP request to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: satark-public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
