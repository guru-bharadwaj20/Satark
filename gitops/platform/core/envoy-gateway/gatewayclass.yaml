# GatewayClass "satark" served by Envoy Gateway. The EnvoyProxy config makes
# each Gateway's data plane a MetalLB LoadBalancer Service with two
# hardened Envoy replicas, kept on different nodes so that losing one node
# does not take down the public entry point (see docs/game-days/load-test-bottleneck.md).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: satark-proxy
  namespace: envoy-gateway-system
spec:
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              # Cordoned and tainted nodes are not counted, so a drain can
              # still reschedule the evicted replica.
              nodeTaintsPolicy: Honor
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  gateway.envoyproxy.io/owning-gateway-name: satark-public
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          # Pool created by the addons role (addons_metallb_pool_name).
          metallb.io/address-pool: lab-pool
      envoyPDB:
        minAvailable: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: satark
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: satark-proxy
    namespace: envoy-gateway-system
