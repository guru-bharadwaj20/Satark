# Helm values for the CloudNativePG operator (chart cnpg/cloudnative-pg).
# The chart version is pinned in scripts/platform/install-cnpg.sh and in the
# Argo CD Application that replaces the script.
replicaCount: 1

crds:
  create: true

config:
  # Watch every namespace; the Satark cluster lives in satark-data.
  clusterWide: true

monitoring:
  # PodMonitor for the operator (needs Prometheus Operator CRDs).
  podMonitorEnabled: false
  grafanaDashboard:
    create: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: ["ALL"]
