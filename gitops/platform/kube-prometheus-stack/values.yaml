# kube-prometheus-stack values for Satark (task 6.1).
fullnameOverride: kps

crds:
  enabled: true

# kubeadm control-plane components listen on localhost by default; the
# Ansible kubeadm role binds metrics endpoints to 0.0.0.0 so these scrapes work.
kubeControllerManager:
  enabled: true
kubeScheduler:
  enabled: true
kubeEtcd:
  enabled: true
kubeProxy:
  enabled: false   # Cilium replaces kube-proxy

prometheus:
  prometheusSpec:
    retention: 35d   # covers the 30d SLO window (task 6.12)
    retentionSize: 18GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Select ServiceMonitors/PodMonitors/PrometheusRules from every namespace,
    # not only those labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 1Gi}
      limits: {memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    retention: 120h
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 128Mi}
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

grafana:
  defaultDashboardsTimezone: Asia/Kolkata
  admin:
    existingSecret: grafana-admin   # created out of band, never committed
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}

kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}
