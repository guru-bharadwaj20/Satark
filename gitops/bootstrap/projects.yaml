# AppProjects that scope what child Applications may deploy.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Cluster platform components (CRDs, operators, observability, data)
  sourceRepos:
    - "*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: satark
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Satark application services
  sourceRepos:
    - https://github.com/guru-bharadwaj20/satark.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: satark
    - server: https://kubernetes.default.svc
      namespace: satark-dev
    - server: https://kubernetes.default.svc
      namespace: satark-sandbox
  # Application services may not create cluster-scoped objects except their CRDs.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
