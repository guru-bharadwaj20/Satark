# App-of-apps root. Applied once by the argocd_bootstrap Ansible role; after
# that it manages itself and every other manifest in gitops/bootstrap/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/guru-bharadwaj20/satark.git
    targetRevision: main
    path: gitops/bootstrap
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
