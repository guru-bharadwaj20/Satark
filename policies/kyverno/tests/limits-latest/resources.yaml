apiVersion: v1
kind: Pod
metadata: {name: good-pod, namespace: satark}
spec:
  containers:
    - name: app
      image: ghcr.io/guru-bharadwaj20/satark/url-intel:v0.1.0
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 128Mi}
---
