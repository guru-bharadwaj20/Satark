      image: ghcr.io/guru-bharadwaj20/satark/url-intel@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 128Mi}
---
