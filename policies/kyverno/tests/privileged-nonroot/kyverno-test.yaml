apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: privileged-nonroot
policies:
  - ../../disallow-privileged-containers.yaml
  - ../../require-run-as-non-root.yaml
resources:
  - resources.yaml
results:
  - {policy: disallow-privileged-containers, rule: privileged-containers, resources: [good-pod, escalation-pod, root-pod], kind: Pod, result: pass}
  - {policy: disallow-privileged-containers, rule: privileged-containers, resources: [privileged-pod], kind: Pod, result: fail}
  - {policy: disallow-privileged-containers, rule: privilege-escalation, resources: [good-pod, privileged-pod], kind: Pod, result: pass}
  - {policy: disallow-privileged-containers, rule: privilege-escalation, resources: [escalation-pod], kind: Pod, result: fail}
  - {policy: require-run-as-non-root, rule: run-as-non-root, resources: [good-pod], kind: Pod, result: pass}
  - {policy: require-run-as-non-root, rule: run-as-non-root, resources: [root-pod], kind: Pod, result: fail}
  - {policy: require-run-as-non-root, rule: run-as-user-not-zero, resources: [good-pod, root-pod], kind: Pod, result: pass}
  - {policy: require-run-as-non-root, rule: run-as-user-not-zero, resources: [uid-zero-pod], kind: Pod, result: fail}
