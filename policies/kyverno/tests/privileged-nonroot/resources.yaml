apiVersion: v1
kind: Pod
metadata: {name: good-pod, namespace: satark}
spec:
  securityContext: {runAsNonRoot: true, runAsUser: 10001}
  containers:
    - name: app
      image: ghcr.io/guru-bharadwaj20/satark/gateway-api:v0.1.0
      securityContext: {allowPrivilegeEscalation: false}
---
