# Task 9.5: only admit Satark images signed keylessly by our GitHub Actions
# release workflow (cosign + Sigstore Fulcio/Rekor). The certificate subject
# must be a workflow in this repository running on a tag or on main.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify cosign keyless signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Images from ghcr.io/guru-bharadwaj20/satark/* must carry a keyless
      cosign signature issued to this repository's GitHub Actions OIDC
      identity and recorded in the Rekor transparency log. Verified images
      are mutated to their digest so a tag cannot be swapped later.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-satark-images
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [satark, satark-sandbox]
      verifyImages:
        - imageReferences:
            - "ghcr.io/guru-bharadwaj20/satark/*"
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/guru-bharadwaj20/satark/\\.github/workflows/[^@]+@refs/(heads/main|tags/v.+)$"
                    rekor:
                      url: https://rekor.sigstore.dev
                    ctlog:
                      ignoreSCT: false
