# Checkov settings for infra/terraform (used by .github/workflows/terraform.yml).
framework:
  - terraform
download-external-modules: false
# Satark custom policies (task 5.20): CKV2_SATARK_1 mandatory tags,
# CKV_SATARK_2 no SSH open to the internet. Path is relative to the repo root.
external-checks-dir:
  - policies/checkov/custom
skip-path:
  - policies/checkov/tests
skip-check:
  # Edge is public ingress by design (80/443 from anywhere); SSH is never opened.
  - CKV_AWS_260
  # Egress to anywhere is required for SSM, apt, ACME and WireGuard.
  - CKV_AWS_382
  # Flow logs / access logging deliberately off to stay near-free.
  - CKV2_AWS_11
  - CKV_AWS_18
  # Cross-region replication and event notifications: not needed for these buckets.
  - CKV_AWS_144
  - CKV2_AWS_62
  # SSE-S3 is acceptable; KMS is optional via kms_key_arn.
  - CKV_AWS_145
  # Log group KMS encryption: session logs contain no secrets.
  - CKV_AWS_158
  # Single-instance edge: no detailed monitoring by default (billed).
  - CKV_AWS_126
  # Budget/state are bootstrap resources; the state bucket enables versioning already.
  - CKV2_AWS_61
