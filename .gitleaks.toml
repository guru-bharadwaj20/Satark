title = "Satark gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\b'''
keywords = ["telegram", "bot", "token"]

[allowlist]
description = "Example and placeholder values"
paths = [
  '''(^|/)testdata/''',
  '''\.env\.example$''',
]
regexes = [
  '''REPLACE_ME''',
  '''changeme''',
]
