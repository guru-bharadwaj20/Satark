[project]
name = "satark-sandbox-browser"
version = "0.1.0"
description = "Headless Chromium sandbox that visits one suspicious link and reports what it saw"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "playwright==1.55.0",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "moto[s3]>=5.0",
]

[project.scripts]
sandbox-browser = "app.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs a real Chromium (playwright install chromium)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
