# Scale sandbox capacity with the scan queue (task 8.21).
#
# Every operator replica runs a job intake that keeps at most
# --max-active-scans (5) sandbox pods running, so replicas = capacity / 5.
# KEDA reads the pending + unacked count of the linkscan-operator consumer
# from the NATS monitoring endpoint and adds a replica per 5 queued jobs.
# Only the leader reconciles; extra replicas just pull and admit jobs.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: controller-manager
spec:
  scaleTargetRef:
    # Full name: kustomize namePrefix does not rewrite scaleTargetRef.
    name: linkscan-operator-controller-manager
  minReplicaCount: 1
  maxReplicaCount: 6
  pollingInterval: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Pods
            value: 1
            periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Pods
            value: 2
            periodSeconds: 30
  triggers:
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: nats.satark-data.svc.cluster.local:8222
      account: "$G"
      stream: SCAN_JOBS
      consumer: linkscan-operator
      lagThreshold: "5"
      activationLagThreshold: "0"
      useHttps: "false"
