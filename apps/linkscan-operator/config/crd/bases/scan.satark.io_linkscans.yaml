---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: linkscans.scan.satark.io
spec:
  group: scan.satark.io
  names:
    categories:
    - satark
    kind: LinkScan
    listKind: LinkScanList
    plural: linkscans
    shortNames:
    - ls
    singular: linkscan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.result.finalURL
      name: Final URL
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LinkScan is a request to open one URL in an isolated sandbox
          browser.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LinkScanSpec defines the link to scan and how the sandbox
              runs.
            properties:
              correlation:
                additionalProperties:
                  type: string
                description: |-
                  Correlation carries opaque caller context (for example the Telegram
                  chat and message to edit) that is echoed back on the result message.
                type: object
              image:
                description: Image overrides the sandbox-browser image configured
                  on the operator.
                type: string
              timeoutSeconds:
                default: 60
                description: TimeoutSeconds bounds how long the sandbox pod may run.
                format: int64
                maximum: 300
                minimum: 10
                type: integer
              ttlSecondsAfterFinished:
                default: 3600
                description: |-
                  TTLSecondsAfterFinished is how long a finished LinkScan is kept before
                  the operator deletes it (and, through owner references, its pod).
                format: int64
                minimum: 0
                type: integer
              url:
                description: URL is the link to open in the sandbox browser.
                maxLength: 2048
                pattern: ^https?://
                type: string
                x-kubernetes-validations:
                - message: url is immutable
                  rule: self == oldSelf
            required:
            - url
            type: object
          status:
            description: LinkScanStatus defines the observed state of LinkScan.
            properties:
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: Message is a human-readable reason for the current phase.
                type: string
              phase:
                description: LinkScanPhase is the lifecycle phase of a LinkScan.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - TimedOut
                type: string
              podName:
                description: PodName is the sandbox pod running this scan.
                type: string
              result:
                description: Result is filled in when the scan succeeds.
                properties:
                  downloads:
                    description: Downloads lists files the page tried to download
                      (for example APKs).
                    items:
                      type: string
                    type: array
                  finalURL:
                    description: FinalURL is the URL after all redirects.
                    type: string
                  forms:
                    description: Forms holds the sensitive form field findings.
                    properties:
                      cardNumber:
                        type: boolean
                      otp:
                        type: boolean
                      password:
                        type: boolean
                    type: object
                  redirectChain:
                    description: RedirectChain lists each hop, starting with spec.url.
                    items:
                      type: string
                    type: array
                  screenshotKey:
                    description: ScreenshotKey is the S3 object key of the full-page
                      screenshot.
                    type: string
                  title:
                    description: Title of the final page.
                    type: string
                type: object
              resultPublished:
                description: ResultPublished is true once the result was published
                  to NATS.
                type: boolean
              startTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
