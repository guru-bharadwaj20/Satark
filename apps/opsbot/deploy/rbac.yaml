# Read-only identity for opsbot.
# - Only get/list/watch verbs; no create/update/delete/exec/port-forward.
# - Explicit resource lists, no wildcards.
# - No access to Secrets (or ConfigMaps, which sometimes hold credentials).
# tests/test_rbac.py enforces these properties.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsbot
  namespace: satark
  labels:
    app.kubernetes.io/name: opsbot
    app.kubernetes.io/part-of: satark
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: satark-opsbot-read
  labels:
    app.kubernetes.io/name: opsbot
    app.kubernetes.io/part-of: satark
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - nodes
      - namespaces
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - resourcequotas
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: satark-opsbot-read
  labels:
    app.kubernetes.io/name: opsbot
    app.kubernetes.io/part-of: satark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: satark-opsbot-read
subjects:
  - kind: ServiceAccount
    name: opsbot
    namespace: satark
