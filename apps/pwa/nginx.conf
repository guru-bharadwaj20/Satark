server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'" always;

    location = /healthz { access_log off; return 200 "ok"; }
    location = /readyz  { access_log off; return 200 "ok"; }

    # Never cache the service worker or the shell, so updates roll out.
    location = /sw.js      { add_header Cache-Control "no-cache" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location /assets/      { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # The gateway-api is reverse-proxied by the cluster ingress at /api/.
    location / { try_files $uri $uri/ /index.html; }
}
