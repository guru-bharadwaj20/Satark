# Values for text-analyzer. Environment overrides live in gitops/envs/{dev,prod}.
replicaCount: 2

image:
  repository: ghcr.io/guru-bharadwaj20/satark/text-analyzer
  tag: ""   # defaults to appVersion; CI bumps this per environment
  pullPolicy: IfNotPresent

service:
  port: 8000

serviceAccount:
  create: true

# Requests size scheduling; only memory is limited (CPU limits cause
# throttling of latency-sensitive Go/Python services).
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 512Mi

# /healthz = process alive; /readyz = dependencies reachable.
startupProbe:
  httpGet: {path: /healthz, port: http}
  periodSeconds: 5
  failureThreshold: 30
livenessProbe:
  httpGet: {path: /healthz, port: http}
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
readinessProbe:
  httpGet: {path: /readyz, port: http}
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

serviceMonitor:
  enabled: false
env:
  LOG_LEVEL: info
  PORT: "8000"
  RULES_DIR: /app/rules

networkPolicy:
  ingressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gateway-api
