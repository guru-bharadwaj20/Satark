[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "satark-obs"
version = "0.1.0"
description = "Shared RED metrics, business metrics and JSON logging for Satark Python services"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "prometheus-client>=0.20",
  "starlette>=0.37",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[tool.hatch.build.targets.wheel]
packages = ["src/satark_obs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
