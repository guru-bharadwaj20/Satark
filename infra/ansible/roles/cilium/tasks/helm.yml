---
- name: Check the installed helm version
  ansible.builtin.command: helm version --short
  register: cilium_helm_installed
  changed_when: false
  failed_when: false

- name: Install helm {{ cilium_helm_version }}
  when: cilium_helm_version not in (cilium_helm_installed.stdout | default(''))
  block:
    - name: Download helm
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ cilium_helm_version }}-linux-amd64.tar.gz"
        dest: /tmp/helm.tar.gz
        checksum: "sha256:{{ cilium_helm_checksum_url }}"
        mode: "0644"

    - name: Unpack helm into /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/helm.tar.gz
        dest: /usr/local/bin
        remote_src: true
        extra_opts: [--strip-components=1, linux-amd64/helm]
        owner: root
        group: root
        mode: "0755"

  always:
    - name: Remove the helm archive
      ansible.builtin.file:
        path: /tmp/helm.tar.gz
        state: absent
