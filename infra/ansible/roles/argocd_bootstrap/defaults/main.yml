---
# Argo CD release installed by the bootstrap role. After the first sync,
# Argo CD manages its own installation from gitops/platform/argocd,
# so keep this version in step with that Application.
argocd_bootstrap_version: "v3.5.3"
argocd_bootstrap_namespace: argocd
argocd_bootstrap_manifest_url: >-
  https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_bootstrap_version }}/manifests/install.yaml
argocd_bootstrap_kubeconfig: /etc/kubernetes/admin.conf
argocd_bootstrap_repo_url: https://github.com/guru-bharadwaj20/satark.git
argocd_bootstrap_repo_revision: main
# Apply the app-of-apps root (gitops/bootstrap/root.yaml) once Argo CD is up.
argocd_bootstrap_apply_root: true
argocd_bootstrap_wait_timeout: 600
