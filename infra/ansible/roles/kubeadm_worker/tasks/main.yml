---
- name: Check whether this node has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubeadm_worker_kubelet_conf

- name: Join the node to the cluster
  when: not kubeadm_worker_kubelet_conf.stat.exists
  block:
    - name: Generate a short-lived join command on the control plane
      ansible.builtin.command: >-
        kubeadm token create --ttl {{ kubeadm_worker_token_ttl }}
        --description "join {{ inventory_hostname }}"
        --print-join-command
      delegate_to: "{{ kubeadm_worker_control_plane_host }}"
      register: kubeadm_worker_join_cmd
      changed_when: true
      no_log: true

    - name: Parse the join command
      ansible.builtin.set_fact:
        kubeadm_worker_endpoint: "{{ kubeadm_worker_join_cmd.stdout.split()[2] }}"
        kubeadm_worker_token: "{{ kubeadm_worker_join_cmd.stdout | regex_search('--token\\s+(\\S+)', '\\1') | first }}"
        kubeadm_worker_ca_hash: "{{ kubeadm_worker_join_cmd.stdout | regex_search('--discovery-token-ca-cert-hash\\s+(\\S+)', '\\1') | first }}"
      no_log: true

    - name: Render the kubeadm join configuration
      ansible.builtin.template:
        src: kubeadm-join.yaml.j2
        dest: "{{ kubeadm_worker_config_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Run kubeadm join
      ansible.builtin.command: kubeadm join --config {{ kubeadm_worker_config_path }}
      changed_when: true

  always:
    - name: Remove the join configuration (it holds a bootstrap token)
      ansible.builtin.file:
        path: "{{ kubeadm_worker_config_path }}"
        state: absent

- name: Approve the kubelet serving certificate for this node
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get csr --no-headers \
      | awk '$NF == "Pending" && $0 ~ /system:node:{{ inventory_hostname }}/ {print $1}' \
      | xargs -r kubectl certificate approve
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ kubeadm_worker_control_plane_host }}"
  register: kubeadm_worker_csr
  changed_when: "'approved' in kubeadm_worker_csr.stdout"
  retries: 6
  delay: 10
  until: kubeadm_worker_csr.rc == 0

- name: Label the node as a worker
  ansible.builtin.command: >-
    kubectl label node {{ inventory_hostname }}
    node-role.kubernetes.io/worker= --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ kubeadm_worker_control_plane_host }}"
  register: kubeadm_worker_label
  changed_when: "'not labeled' not in kubeadm_worker_label.stdout"
