---
# Kernel modules required by containerd and Kubernetes networking.
k8s_prereqs_kernel_modules:
  - overlay
  - br_netfilter

# sysctls required by Kubernetes.
k8s_prereqs_sysctl:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  # Plenty of inotify watches for kubelet and log shippers.
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 8192
