---
- name: Create ~/.kube for node users
  ansible.builtin.file:
    path: "~{{ item }}/.kube"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: "{{ kubeadm_cp_kubeconfig_users }}"

- name: Copy admin.conf to node users
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "~{{ item }}/.kube/config"
    remote_src: true
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0600"
  loop: "{{ kubeadm_cp_kubeconfig_users }}"

- name: Fetch admin.conf to the Ansible control node
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeadm_cp_local_kubeconfig }}"
    flat: true

- name: Restrict permissions on the local kubeconfig
  ansible.builtin.file:
    path: "{{ kubeadm_cp_local_kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
  # The ansible_become inventory variable outranks the become keyword.
  vars:
    ansible_become: false

- name: Show how to use the local kubeconfig
  ansible.builtin.debug:
    msg: "export KUBECONFIG={{ kubeadm_cp_local_kubeconfig }}"
