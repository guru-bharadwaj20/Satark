---
- name: Read the installed kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_cp_installed_version
  changed_when: false
  when: kubeadm_cp_kubernetes_version | length == 0

- name: Select the Kubernetes version to deploy
  ansible.builtin.set_fact:
    kubeadm_cp_effective_version: "{{ kubeadm_cp_kubernetes_version or kubeadm_cp_installed_version.stdout | trim }}"

- name: Create audit policy and log directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ kubeadm_cp_audit_policy_dir }}"
    - "{{ kubeadm_cp_audit_log_dir }}"

- name: Install the API server audit policy
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: "{{ kubeadm_cp_audit_policy_dir }}/audit-policy.yaml"
    owner: root
    group: root
    mode: "0640"

- name: Render the kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{ kubeadm_cp_config_path }}"
    owner: root
    group: root
    mode: "0600"
