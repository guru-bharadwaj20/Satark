---
# Rendered kubeadm configuration.
kubeadm_cp_config_path: /etc/kubernetes/kubeadm-config.yaml
# Empty means "the version of the installed kubeadm binary", which is kept in
# step with the packages pinned by k8s_prereqs.
kubeadm_cp_kubernetes_version: ""
kubeadm_cp_cluster_name: "{{ cluster_name | default('satark-onprem') }}"
kubeadm_cp_advertise_address: "{{ node_ip | default(ansible_host) }}"
kubeadm_cp_control_plane_endpoint: "{{ control_plane_endpoint | default(kubeadm_cp_advertise_address ~ ':6443') }}"
kubeadm_cp_pod_subnet: "{{ pod_network_cidr | default('10.244.0.0/16') }}"
kubeadm_cp_service_subnet: "{{ service_cidr | default('10.96.0.0/12') }}"
kubeadm_cp_dns_domain: "{{ cluster_dns_domain | default('cluster.local') }}"
# Extra SANs on the API server certificate.
kubeadm_cp_cert_sans:
  - "{{ kubeadm_cp_advertise_address }}"
  - "{{ inventory_hostname }}"
  - 127.0.0.1
  - localhost
# Skip kube-proxy: Cilium runs with kube-proxy replacement.
kubeadm_cp_skip_kube_proxy: true

# --- API server audit logging -----------------------------------------
kubeadm_cp_audit_policy_dir: /etc/kubernetes/audit
kubeadm_cp_audit_log_dir: /var/log/kubernetes/audit
kubeadm_cp_audit_log_maxage: 30
kubeadm_cp_audit_log_maxbackup: 10
kubeadm_cp_audit_log_maxsize: 100

# --- kubeadm init and kubeconfig distribution -------------------------
kubeadm_cp_init_timeout: 600
# Node users that get a copy of admin.conf in ~/.kube/config.
kubeadm_cp_kubeconfig_users: "{{ ['vagrant'] + (admin_users | default([]) | map(attribute='name') | list) }}"
# Where admin.conf is written on the Ansible control node (never committed).
kubeadm_cp_local_kubeconfig: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/{{ kubeadm_cp_cluster_name }}.conf"
