---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Configure unattended-upgrades to apply security updates only
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable periodic apt runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

# Some base boxes (bento) mask the apt services with /dev/null symlinks,
# and a timer will not start while the unit it triggers is masked.
# systemd_service's masked=false does not detect this, so call systemctl.
- name: Unmask the apt services
  ansible.builtin.command: systemctl unmask apt-daily.service apt-daily-upgrade.service
  register: common_apt_unmask
  changed_when: "'Removed' in common_apt_unmask.stderr"

- name: Enable the apt timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
