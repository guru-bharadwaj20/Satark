---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Set hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Add every cluster node to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ item }}$'
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
  loop: "{{ groups['all'] }}"

- name: Create admin users
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default([]) }}"
    append: true
    shell: /bin/bash
    create_home: true
  loop: "{{ common_admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install admin SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ lookup('ansible.builtin.file', item.ssh_public_key_file) }}"
    exclusive: false
  loop: "{{ common_admin_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.ssh_public_key_file is defined

- name: Grant admin users passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ common_admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Disable systemd-timesyncd in favour of chrony
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  failed_when: false

- name: Enable chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limit journald disk usage
  ansible.builtin.template:
    src: journald-satark.conf.j2
    dest: /etc/systemd/journald.conf.d/50-satark.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
