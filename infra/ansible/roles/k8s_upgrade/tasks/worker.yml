---
# Worker node upgrade: drain (from the control plane), upgrade kubeadm and
# the node config, upgrade kubelet, uncordon.
- name: Drain worker
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_upgrade_kubeconfig }} drain {{ k8s_node_name }}
    --ignore-daemonsets --delete-emptydir-data --timeout={{ k8s_upgrade_drain_timeout }}
  delegate_to: "{{ k8s_upgrade_first_cp }}"
  changed_when: true

- name: Unhold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: install

- name: Install target kubeadm
  ansible.builtin.apt:
    name: "kubeadm={{ k8s_upgrade_pkg_version }}"
    state: present

- name: Hold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold

- name: Upgrade node configuration
  ansible.builtin.command: kubeadm upgrade node
  changed_when: true

- name: Upgrade kubelet and kubectl
  ansible.builtin.include_tasks: kubelet.yml

- name: Uncordon worker
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_upgrade_kubeconfig }} uncordon {{ k8s_node_name }}
  delegate_to: "{{ k8s_upgrade_first_cp }}"
  changed_when: true

- name: Wait for pods on this node to settle
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_upgrade_kubeconfig }} get pods -A
    --field-selector spec.nodeName={{ k8s_node_name }},status.phase=Pending -o name
  delegate_to: "{{ k8s_upgrade_first_cp }}"
  register: pending
  changed_when: false
  until: pending.stdout | length == 0
  retries: 30
  delay: 10
