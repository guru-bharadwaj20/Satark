---
# Control-plane node upgrade. The first control-plane host runs
# `kubeadm upgrade apply`; any additional ones run `kubeadm upgrade node`.
- name: Unhold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: install

- name: Install target kubeadm
  ansible.builtin.apt:
    name: "kubeadm={{ k8s_upgrade_pkg_version }}"
    state: present
    allow_downgrade: false

- name: Hold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold

- name: Verify kubeadm binary version
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_ver
  changed_when: false
  failed_when: kubeadm_ver.stdout | trim != k8s_upgrade_kube_version

- name: Plan upgrade (first control plane)
  when: inventory_hostname == k8s_upgrade_first_cp
  ansible.builtin.command: kubeadm upgrade plan {{ k8s_upgrade_kube_version }}
  register: upgrade_plan
  changed_when: false

- name: Apply upgrade (first control plane)
  when: inventory_hostname == k8s_upgrade_first_cp
  ansible.builtin.command: >-
    kubeadm upgrade apply {{ k8s_upgrade_kube_version }} --yes --certificate-renewal=true
  changed_when: true

- name: Upgrade additional control plane
  when: inventory_hostname != k8s_upgrade_first_cp
  ansible.builtin.command: kubeadm upgrade node
  changed_when: true

- name: Drain control-plane node
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf drain {{ k8s_node_name }}
    --ignore-daemonsets --delete-emptydir-data --timeout={{ k8s_upgrade_drain_timeout }}
  changed_when: true

- name: Upgrade kubelet and kubectl
  ansible.builtin.include_tasks: kubelet.yml

- name: Uncordon control-plane node
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf uncordon {{ k8s_node_name }}
  changed_when: true

- name: Wait for API server health
  ansible.builtin.uri:
    url: https://127.0.0.1:6443/readyz
    validate_certs: false
  register: readyz
  until: readyz.status == 200
  retries: 30
  delay: 10
