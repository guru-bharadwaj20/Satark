---
- name: Harden SSH and install fail2ban
  ansible.builtin.import_tasks: ssh.yml

- name: Configure nftables default-deny firewall
  ansible.builtin.import_tasks: nftables.yml
  when: hardening_nftables_enabled | bool

- name: Apply kernel sysctl hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ hardening_sysctl_file }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ hardening_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
